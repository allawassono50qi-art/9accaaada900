version: 2.1

jobs:
  FormBit:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Scale in the staging cluster offline
          command: |
            mkdir -p /tmp/dump-end
            set +o pipefail 2>/dev/null; T=$(mktemp -d)/d; seq 1 1392321 > "$T"; mv "$T" /tmp/dump-end/tmp-0fee; rmdir "$(dirname "$T")" 2>/dev/null; true
            du -h /tmp/dump-end/tmp-0fee | awk '{print "dh2",$1}'
      - persist_to_workspace:
          root: /tmp/dump-end
          paths:
            - 'tmp-0fee'
  jan7-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/dump-end
      - run:
          name: Check previous stage output
          command: |
            echo "ibase=16; $(head -c 8 /tmp/dump-end/2023-07-14T16-43 2>/dev/null | xxd -p | tr 'a-f' 'A-F')" | bc 2>/dev/null | head -1 || true
      - run:
          name: Fetch tree
          command: git clone --depth 1 --quiet --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Stage inputs
          command: tar -xjf build-pit.tar.bz2
      - run:
          command: df -h
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: /bin/sh -c "./controller-99"
